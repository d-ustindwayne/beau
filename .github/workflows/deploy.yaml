name: Deploy Beau to GitHub Pages

on:
  push:
    branches: ["main"] # Change to your default branch if it's "master"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # Public URL of the Jinny Cloudflare Worker (repo Settings > Variables > Actions). Not a secret.
          VITE_JINNY_API_URL: ${{ vars.JINNY_API_URL }}

      # GitHub Pages has no SPA routing: serving the app as 404.html lets
      # deep links and refreshes (e.g. /beau/shop) load the app instead of a 404.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4